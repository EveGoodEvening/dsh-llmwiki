- id: tools
  name: '@deepseek-ai/dsh-tools'
  config:
    mode: native
- id: commands
  name: '@deepseek-ai/dsh-commands'
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
- id: llmwiki
  name: '@evegoodevening/dsh-llmwiki'
  inject:
    - tools
    - commands
    - systemPrompt
  config:
    root: ./demo-wiki
    maxSourceBytes: 2097152
    maxPageBytes: 524288
    maxResults: 20
    maxSnippetBytes: 1200
    commandDiagnosticLimit: 20
