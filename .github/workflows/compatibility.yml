name: Upstream compatibility

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'EveGoodEvening/dsh-llmwiki' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      dsh: ${{ steps.versions.outputs.dsh }}
      cordis: ${{ steps.versions.outputs.cordis }}
      host-outcome: ${{ steps.host.outcome }}
      host-stage: ${{ steps.host.outputs.stage }}
      cordis-outcome: ${{ steps.cordis.outcome }}
      cordis-stage: ${{ steps.cordis.outputs.stage }}
    steps:
      - name: Check out monitored source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve current npm latest tags once
        id: versions
        run: node scripts/check-compatibility.ts resolve

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          cache: false

      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile

      - name: Check latest DSH with its native dependency resolution
        id: host
        continue-on-error: true
        env:
          LLMWIKI_COMPAT_DSH_VERSION: ${{ steps.versions.outputs.dsh }}
          LLMWIKI_COMPAT_CORDIS_VERSION: ${{ steps.versions.outputs.cordis }}
        run: pnpm run check:compatibility host

      - name: Check latest DSH with latest Cordis forced
        id: cordis
        continue-on-error: true
        env:
          LLMWIKI_COMPAT_DSH_VERSION: ${{ steps.versions.outputs.dsh }}
          LLMWIKI_COMPAT_CORDIS_VERSION: ${{ steps.versions.outputs.cordis }}
        run: pnpm run check:compatibility cordis

      - name: Require both completed probes
        if: always()
        env:
          HOST_OUTCOME: ${{ steps.host.outcome }}
          HOST_STAGE: ${{ steps.host.outputs.stage }}
          CORDIS_OUTCOME: ${{ steps.cordis.outcome }}
          CORDIS_STAGE: ${{ steps.cordis.outputs.stage }}
        run: |
          test "$HOST_OUTCOME" = success && test "$HOST_STAGE" = complete &&
          test "$CORDIS_OUTCOME" = success && test "$CORDIS_STAGE" = complete

  report:
    needs: check
    if: always() && needs.check.result != 'cancelled' && needs.check.result != 'skipped' && github.repository == 'EveGoodEvening/dsh-llmwiki' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted reporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      # No upstream package installation in this job; only the reporter gets a write token.
      - name: Update deduplicated issue or report recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPAT_CHECK_RESULT: ${{ needs.check.result }}
          COMPAT_DSH_VERSION: ${{ needs.check.outputs.dsh }}
          COMPAT_CORDIS_VERSION: ${{ needs.check.outputs.cordis }}
          COMPAT_HOST_OUTCOME: ${{ needs.check.outputs.host-outcome }}
          COMPAT_HOST_STAGE: ${{ needs.check.outputs.host-stage }}
          COMPAT_CORDIS_OUTCOME: ${{ needs.check.outputs.cordis-outcome }}
          COMPAT_CORDIS_STAGE: ${{ needs.check.outputs.cordis-stage }}
        run: node scripts/report-compatibility.ts
