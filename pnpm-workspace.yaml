# Seven days, in minutes; applies to direct and transitive dependencies.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

allowBuilds:
  'esbuild@0.28.2': true

overrides:
  'js-yaml@^4': 4.3.2
  'brace-expansion@^1': 1.1.21
  'brace-expansion@^5': 5.0.12
  source-map-js: 1.2.2
  'vite@^8': 8.3.4
  'zod@^4': 4.6.6
